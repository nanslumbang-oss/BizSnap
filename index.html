<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BizSnap - Direktori UMKM & Perusahaan</title>
  
  <!-- FontAwesome 6 Icon CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font Inter -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <!-- Style Utama -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========================================== -->
  <!-- [BLOK 1] NAVBAR / HEADER BIZSNAP          -->
  <!-- ========================================== -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand-logo">
        <i class="fa-solid fa-store logo-icon"></i>
        <div class="brand-text">
          <h1 class="brand-title">BIZSNAP</h1>
          <p class="brand-subtitle">Direktori UMKM & Perusahaan</p>
        </div>
      </div>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- [BLOK 2] SEARCH & FILTER BAR             -->
  <!-- ========================================== -->
  <section class="filter-section">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" placeholder="Cari nama tempat, lokasi, atau kata kunci...">
    </div>

    <div class="filter-group">
      <div class="select-wrapper">
        <i class="fa-solid fa-layer-group select-icon"></i>
        <select id="categoryFilter" class="filter-select">
          <option value="all">Semua Kategori</option>
          <option value="Cafe">Cafe & Coffee Shop</option>
        </select>
      </div>

      <div class="select-wrapper">
        <i class="fa-solid fa-location-dot select-icon"></i>
        <select id="locationFilter" class="filter-select">
          <option value="all">Semua Lokasi</option>
          <option value="Malang">Malang</option>
          <option value="Batu">Batu</option>
        </select>
      </div>
    </div>
  </section>

  <!-- ========================================== -->
  <!-- [BLOK 3] GRID CARD CONTAINER               -->
  <!-- ========================================== -->
  <main class="main-content">
    <div id="umkmContainer" class="grid-container">
      <!-- Di-render otomatis lewat script.js -->
    </div>
  </main>

  <!-- ========================================== -->
  <!-- [BLOK 4] MODAL DETAIL POPUP               -->
  <!-- ========================================== -->
  <div id="detailModal" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      <div id="modalBody">
        <!-- Injeksi via JS -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
