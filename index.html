<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BizSnap - Direktori UMKM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========================================== -->
  <!-- [SEKSI 1] HEADER, SEARCH & FILTER CATEGORY -->
  <!-- ========================================== -->
  <header class="navbar">
    <div class="brand-box">
      <h1 class="brand-title">BIZSNAP</h1>
      <p class="brand-sub">Direktori Cafe & Tempat Ngopi Terpercaya</p>
    </div>

    <!-- Pencarian (Bisa ketik nama cafe atau nama kota) -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Cari nama cafe atau kota (misal: Malang)...">
    </div>

    <!-- Filter Kategori Utama -->
    <div class="category-pills">
      <button class="pill active" onclick="filterCategory('all', this)">Semua Kategori</button>
      <button class="pill" onclick="filterCategory('Cafe', this)">☕ Cafe</button>
    </div>

    <!-- Filter Kota (BARU) -->
    <div class="category-pills city-pills">
      <button class="pill pill-city active" onclick="filterCity('all', this)">📍 Semua Kota</button>
      <button class="pill pill-city" onclick="filterCity('Malang', this)">Malang</button>
      <button class="pill pill-city" onclick="filterCity('Surabaya', this)">Surabaya</button>
      <button class="pill pill-city" onclick="filterCity('Batu', this)">Batu</button>
      <button class="pill pill-city" onclick="filterCity('Pasuruan', this)">Pasuruan</button>
    </div>
  </header>
  

  <!-- ========================================== -->
  <!-- [SEKSI 2] CONTAINER GRID KARTU UMKM       -->
  <!-- ========================================== -->
  <main class="container">
    <div class="grid-container" id="gridContainer">
      <!-- Kartu di-render otomatis dari script.js -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
