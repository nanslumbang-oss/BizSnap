<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BizSnap - Direktori UMKM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========================================== -->
  <!-- [SEKSI 1] HEADER, SEARCH & FILTER CATEGORY -->
  <!-- ========================================== -->
  <header class="navbar">
    <div class="brand-box">
      <h1 class="brand-title">BIZSNAP</h1>
      <p class="brand-sub">Direktori UMKM & Perusahaan</p>
    </div>

    <!-- Pencarian -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Cari UMKM atau produk...">
    </div>

    <!-- Filter Kategori -->
    <div class="category-pills">
      <button class="pill active" onclick="filterCategory('all', this)">Semua</button>
      <button class="pill" onclick="filterCategory('Cafe', this)">Cafe</button>
    </div>
    
  </header>

  <!-- ========================================== -->
  <!-- [SEKSI 2] CONTAINER GRID KARTU UMKM       -->
  <!-- ========================================== -->
  <main class="container">
    <div class="grid-container" id="gridContainer">
      <!-- Kartu di-render otomatis dari script.js -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
