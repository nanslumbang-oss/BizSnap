<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BizSnap - Direktori UMKM</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========================================== -->
  <!-- BLOK 1: BAGIAN ATAS (Logo & Menu Garis 3)  -->
  <!-- ========================================== -->
  <header class="sticky-header">
    <div class="nav-container">
      <div class="brand-logo">
        <i class="fa-solid fa-store logo-icon"></i>
        <div class="brand-text">
          <h1 class="brand-title">BIZSNAP</h1>
          <p class="brand-subtitle">Direktori UMKM</p>
        </div>
      </div>
      
      <!-- TOMBOL GARIS 3 (BURGER) -->
      <button class="menu-toggle" id="menuToggle">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>

    <!-- ========================================== -->
    <!-- BLOK 2: KOLOM PENCARIAN & FILTER           -->
    <!-- ========================================== -->
    <div class="filter-section">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" placeholder="Cari nama tempat atau lokasi...">
      </div>

      <div class="filter-group">
        <!-- Filter Kategori (Cafe, Resto, dll) -->
        <div class="custom-dropdown" id="dropdownCategory">
          <div class="dropdown-trigger">
            <i class="fa-solid fa-layer-group select-icon"></i>
            <span class="dropdown-label" id="categoryLabel">Semua Kategori</span>
            <i class="fa-solid fa-chevron-down chevron-icon"></i>
          </div>
          <div class="dropdown-menu">
            <div class="dropdown-item active" data-value="all">Semua Kategori</div>
            <div class="dropdown-item" data-value="Cafe">Cafe & Coffee Shop</div>
             <div class="dropdown-item" data-value="Wisata">Tempat Wisata</div>
            <div class="dropdown-item" data-value="Fashion">Toko Fashion</div>
            <div class="dropdown-item" data-value="Toko Perhiasan">Perhiasan</div>
            <div class="dropdown-item" data-value="Jasa Desain">Jasa Desain</div>
          </div>
        </div>

        <!-- Filter Lokasi (Provinsi & Kota - Kosong karena diisi otomatis) -->
        <div class="custom-dropdown" id="dropdownLocation">
          <div class="dropdown-trigger">
            <i class="fa-solid fa-location-dot select-icon"></i>
            <span class="dropdown-label" id="locationLabel">Semua Lokasi</span>
            <i class="fa-solid fa-chevron-down chevron-icon"></i>
          </div>
          <div class="dropdown-menu" id="locationMenu"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- BLOK 3: TEMPAT KARTU CAFE MUNCUL           -->
  <!-- ========================================== -->
  <main class="main-content">
    <div id="umkmContainer" class="grid-container"></div>
  </main>

  <!-- ========================================== -->
  <!-- BLOK 4: POPUP DETAIL (Saat klik "Detail")  -->
  <!-- ========================================== -->
  <div id="detailModal" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- BLOK 5: ISI MENU SAAT GARIS 3 DIKLIK       -->
  <!-- ========================================== -->
  <div class="menu-overlay" id="menuOverlay"></div>
  <div class="side-menu" id="sideMenu">
    <div class="side-menu-header">
      <h2>Menu</h2>
      <button class="close-menu" id="closeMenu"><i class="fa-solid fa-xmark"></i></button>
    </div>
    
<div class="side-menu-links">
  <a href="index.html" id="navBeranda"><i class="fa-solid fa-house"></i> Beranda</a>
  <a href="tentang.html"><i class="fa-solid fa-circle-info"></i> Tentang Kami</a>
  <a href="favorit.html"><i class="fa-solid fa-heart"></i> Favorit Saya</a>
  <a href="kontak.html"><i class="fa-solid fa-envelope"></i> Hubungi Kami</a>
</div>


  <script src="script.js"></script>
</body>
</html>
