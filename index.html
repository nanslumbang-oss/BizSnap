<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BizSnap - Direktori UMKM & Perusahaan</title>
  
  <!-- FontAwesome 6 Icon CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font Inter -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <!-- Style Utama -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========================================== -->
  <!-- [HEADER STICKY] LOGO + SEARCH + FILTER     -->
  <!-- ========================================== -->
  <header class="sticky-header">
    <div class="nav-container">
      <div class="brand-logo">
        <i class="fa-solid fa-store logo-icon"></i>
        <div class="brand-text">
          <h1 class="brand-title">BIZSNAP</h1>
          <p class="brand-subtitle">Direktori UMKM & Perusahaan</p>
        </div>
      </div>
    </div>

    <div class="filter-section">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" placeholder="Cari nama tempat, lokasi, atau kata kunci...">
      </div>

      <div class="filter-group">
        <!-- Custom Dropdown Kategori -->
        <div class="custom-dropdown" id="dropdownCategory">
          <div class="dropdown-trigger">
            <i class="fa-solid fa-layer-group select-icon"></i>
            <span class="dropdown-label" id="categoryLabel">Semua Kategori</span>
            <i class="fa-solid fa-chevron-down chevron-icon"></i>
          </div>
          <div class="dropdown-menu">
            <div class="dropdown-item active" data-value="all">Semua Kategori</div>
            <div class="dropdown-item" data-value="Cafe">Cafe & Coffee Shop</div>
          </div>
        </div>

        <!-- Custom Dropdown Lokasi -->
        <div class="custom-dropdown" id="dropdownLocation">
          <div class="dropdown-trigger">
            <i class="fa-solid fa-location-dot select-icon"></i>
            <span class="dropdown-label" id="locationLabel">Semua Lokasi</span>
            <i class="fa-solid fa-chevron-down chevron-icon"></i>
          </div>
          <div class="dropdown-menu">
            <div class="dropdown-item active" data-value="all">Semua Lokasi</div>
            <div class="dropdown-item" data-value="Malang">Malang</div>
            <div class="dropdown-item" data-value="Batu">Batu</div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- [GRID CARD CONTAINER]                      -->
  <!-- ========================================== -->
  <main class="main-content">
    <div id="umkmContainer" class="grid-container">
      <!-- Di-render otomatis lewat script.js -->
    </div>
  </main>

  <!-- ========================================== -->
  <!-- [MODAL DETAIL POPUP]                       -->
  <!-- ========================================== -->
  <div id="detailModal" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      <div id="modalBody">
        <!-- Injeksi via JS -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
