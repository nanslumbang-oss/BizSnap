<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BizSnap - Directory Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Overlay Bar -->
  <header class="top-overlay">
    <div class="top-brand">
      <h1 class="brand-title">BIZSNAP</h1>
      <span id="cardCounter" class="card-counter">1 / 3</span>
    </div>

    <!-- Filter Kategori Melayang -->
    <div class="filter-pills" id="filterPills">
      <button class="pill active" onclick="filterCategory('all')">Semua</button>
      <button class="pill" onclick="filterCategory('Kuliner')">Kuliner</button>
      <button class="pill" onclick="filterCategory('Jasa & Care')">Jasa</button>
      <button class="pill" onclick="filterCategory('Kreatif & IT')">Kreatif</button>
    </div>
  </header>

  <!-- Fullpage Snap Container -->
  <main class="snap-container" id="snapContainer">
    <!-- Kartu di-generate via script.js -->
  </main>

  <script src="script.js"></script>
</body>
</html>
